services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sportyqo
      POSTGRES_PASSWORD: sportyqo
      POSTGRES_DB: sportyqo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportyqo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://sportyqo:sportyqo@db:5432/sportyqo
      BASE_URL: ${BASE_URL}
      SHARE_BASE_URL: ${SHARE_BASE_URL:-https://sportyqo.app}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    expose:
      - "8000"
    volumes:
      - storage:/srv/sportyqo/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  storage:
